app: vjepa
nodes: 1
tasks_per_node: 2
cpus_per_task: 32
mem_per_gpu: 220G
folder: /scratch/sd6701/vjepa2_runs/vits.ssv2-k400-diving48.256px.16f.50ep
data:
  dataset_type: VideoDataset
  # No datasets_weights: uniform sampling over the concatenation, so one epoch
  # is one full pass over all three datasets.
  datasets:
  - /gpfs/scratch/sd6701/personal/salt/datasets/ssv2/labels/train.json
  - /gpfs/scratch/sd6701/personal/salt/datasets/k400/train_labeled_nonempty.csv
  - /gpfs/scratch/sd6701/personal/salt/datasets/diving48/train_v2_labeled.csv
  batch_size: 32
  crop_size: 256
  patch_size: 16
  dataset_fpcs:
  - 16
  - 16
  - 16
  tubelet_size: 1
  fps: 4
  num_workers: 8
  persistent_workers: true
  pin_mem: true
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0
loss:
  loss_exp: 1.0
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
meta:
  use_wandb: true
  wandb_project: vjepa2
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: true
  read_checkpoint: null
  save_every_freq: 5
  seed: 239
  use_sdpa: true
model:
  model_name: vit_small
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  ema:
  - 0.99925
  - 0.99925
  epochs: 50
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  # null -> iterations per epoch = len(dataloader), i.e. a true dataset epoch
  ipe: null
  ipe_scale: 1.25
  lr: 0.0004
  start_lr: 6.7e-05
  warmup: 2
  weight_decay: 0.04
