app: vjepa
nodes: 1
tasks_per_node: 4
cpus_per_task: 32
mem_per_gpu: 220G
# Same as pretrain-256px-16f-100ep-ssv2.yaml (run 29475368) except tubelet 2, 300 epochs,
# checkpoints every 10 epochs.
folder: /gpfs/scratch/sd6701/vjepa2_runs/vits.ssv2.256px.16f.300ep.t2
data:
  dataset_type: VideoDataset
  datasets:
  - /gpfs/scratch/sd6701/personal/salt/datasets/ssv2/labels/train.json
  batch_size: 32
  crop_size: 256
  patch_size: 16
  dataset_fpcs:
  - 16
  # 2 = V-JEPA 2 default (2 frames per token, 2048 tokens/clip). Our earlier runs used 1
  # (4096 tokens/clip, ~2x+ compute); t1 and t2 checkpoints are not directly comparable,
  # and the eval config's tubelet_size must match this value.
  tubelet_size: 2
  fps: 4
  num_workers: 8
  persistent_workers: true
  pin_mem: true
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0
loss:
  loss_exp: 1.0
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
meta:
  use_wandb: true
  wandb_project: vjepa2
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: true
  read_checkpoint: null
  save_every_freq: 10
  seed: 239
  use_sdpa: true
model:
  model_name: vit_small
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  ema:
  - 0.99925
  - 0.99925
  epochs: 300
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  # null -> iterations per epoch = len(dataloader), i.e. a true dataset epoch
  ipe: null
  ipe_scale: 1.25
  lr: 0.0004
  start_lr: 6.7e-05
  # kept at 10 epochs (~13k steps on 4 GPUs), same warmup length in steps as the 100ep run
  warmup: 10
  weight_decay: 0.04
